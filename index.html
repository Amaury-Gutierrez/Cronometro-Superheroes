<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cronómetro Superhéroes</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      /* Fondo azul y rojo estilo cómic */
      background: linear-gradient(#4A90E2, #ff8a8a);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
    }
    
    .fondo-ciudad {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 70vh;
      /* Se mantiene tu imagen actual hasta que la cambies */
      background-image: url("images/granja.png");
      background-repeat: no-repeat;
      background-position: bottom center;
      background-size: 100% auto;

      z-index: 0;
      pointer-events: none;
    }

    .decoracion-cielo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 55vh;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .decoracion-cielo img {
      position: absolute;
      object-fit: contain;
      user-select: none;
      pointer-events: none;
    }

    .sol-img {
      width: clamp(90px, 10vw, 150px);
      top: 4vh;
      right: 25vw;
      animation: brillo-sol 3s ease-in-out infinite alternate;
    }

    .nube-img {
      opacity: 0.95;
      filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.08));
    }

    .nube-1 {
      width: clamp(130px, 16vw, 240px);
      top: 15vh;
      left: 15vw;
      animation: flotar-nube-1 5s ease-in-out infinite alternate;
    }

    .nube-2 {
      width: clamp(110px, 13vw, 210px);
      top: 24vh;
      right: 15vw;
      opacity: 0.85;
      animation: flotar-nube-2 6s ease-in-out infinite alternate;
    }

    .nube-3 {
      width: clamp(170px, 10vw, 300px);
      top: 3vh;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1;
      animation: flotar-nube-superheroe 4.5s ease-in-out infinite alternate;
    }

    @keyframes flotar-nube-1 {
      from { transform: translateY(0); }
      to { transform: translateY(10px); }
    }

    @keyframes flotar-nube-2 {
      from { transform: translateY(0) translateX(0); }
      to { transform: translateY(-8px) translateX(-10px); }
    }

    @keyframes flotar-nube-superheroe {
      from { transform: translateX(-50%) translateY(0) rotate(-1deg); }
      to { transform: translateX(-50%) translateY(12px) rotate(1deg); }
    }

    @keyframes brillo-sol {
      from {
        transform: scale(1);
        filter: drop-shadow(0 0 4px rgba(255, 196, 0, 0.4));
      }
      to {
        transform: scale(1.05);
        filter: drop-shadow(0 0 14px rgba(255, 196, 0, 0.65));
      }
    }

    #zona-superheroes {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 20vh;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }
    
    .superheroe-suelto {
      position: absolute;
      font-size: 75px;
      cursor: grab;
      user-select: none;
      touch-action: none;
      pointer-events: auto;
      transition: transform 0.15s;
    }
    
    .superheroe-suelto:active {
      cursor: grabbing;
      transform: scale(1.15);
    }

    .nombre-autor {
      position: absolute;
      top: -28px;
      left: 50%;
      transform: translateX(-50%);

      /* Colores estilo insignia */
      background-color: #FFD700; 
      color: #D32F2F;
      border: 3px solid #D32F2F;
      border-radius: 18px;

      padding: 8px 22px;
      font-size: 17px;
      font-weight: bold;
      letter-spacing: 0.4px;

      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.18);
      white-space: nowrap;
    }

    .contenedor {
      position: relative;
      z-index: 2;
      background-color: rgba(255, 255, 255, 0.95);
      border: 5px solid #1E88E5; /* Borde azul heroico */
      border-radius: 30px;
      padding: 45px 50px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      width: 520px;     
      min-height: 320px; 
      backdrop-filter: blur(2px);
    }

    h1 {
      color: #D32F2F; /* Rojo vibrante */
      margin-bottom: 10px;
      font-size: 50px;
      text-shadow: 3px 3px 0px #FFD700; /* Sombra amarilla estilo cómic */
    }
    
    .superheroe {
      font-size: 100px;
      margin: 10px 0;
      animation: saltito 1s infinite alternate;
    }

    @keyframes saltito {
      from { transform: translateY(0); }
      to { transform: translateY(-10px); }
    }

    #tiempo {
      font-size: 48px;
      font-weight: bold;
      color: #1E88E5; /* Azul vibrante */
      margin: 25px 0;
      background-color: #FFF9C4; /* Fondo amarillo claro */
      padding: 15px;
      border-radius: 20px;
      border: 3px dashed #D32F2F; /* Borde rojo */
    }
    
    .botones button {
      font-size: 18px;
      padding: 12px 18px;
      margin: 8px;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    #play {
      background-color: #1E88E5; /* Azul */
      color: white;
    }

    #detener {
      background-color: #D32F2F; /* Rojo */
      color: white;
    }

    #reiniciar {
      background-color: #FFD700; /* Amarillo/Dorado */
      color: #b71c1c; /* Texto oscuro para contrastar */
    }

    button:hover {
      transform: scale(1.08);
      opacity: 0.9;
    }
  </style>
</head>

<body>
  <div class="decoracion-cielo">
    <img src="images/sol.png" class="sol-img" alt="Sol">
    <img src="images/nube1.png" class="nube-img nube-1" alt="Nube">
    <img src="images/nube2.png" class="nube-img nube-2" alt="Nube">
    <img src="images/nube3.png" class="nube-img nube-3" alt="Nube superhéroe">
  </div>

  <div class="fondo-ciudad"></div>

  <div id="zona-superheroes"></div>

  <div class="contenedor">
    <div class="nombre-autor"> 🦸🏼‍♀️ Cesia Josselyn Flores Juárez 🦸🏼‍♀️</div>

    <h1>Cronómetro Superhéroes</h1>

    <div class="superheroe">🦸🏼‍♀️</div>

    <div id="tiempo">00:00.00</div>

    <div class="botones">
      <button id="play">▶️ Play</button>
      <button id="detener">⏸️ Detener</button>
      <button id="reiniciar">🔄 Reiniciar</button>
    </div>
  </div>

<script>
  let tiempo_acumulado = 0;  
  let tiempo_inicio = null;  
  let intervalo = null;

  const limite = 15 * 60 * 1000;

  const tiempo = document.getElementById("tiempo");
  const boton_play = document.getElementById("play");
  const boton_detener = document.getElementById("detener");
  const boton_reiniciar = document.getElementById("reiniciar");

  const zona_superheroes = document.getElementById("zona-superheroes");

  const tiempo_entre_superheroes = 1 * 60 * 1000;
  const velocidad_superheroe = 1.5;

  // Mantenemos la ruta de tu audio actual hasta que la cambies
  const sonido_superheroe = new Audio("audio/sonido_pollito.mp3");
  sonido_superheroe.volume = 1;
  sonido_superheroe.preload = "auto";

  let superheroes = [];
  let intervalo_superheroes = null;
  let animacion_superheroes = null;
  let superheroes_activos = false;
  let siguiente_superheroe_ms = tiempo_entre_superheroes;

  function mostrar_tiempo(ms) {
    let minutos = Math.floor(ms / 60000);
    let segundos = Math.floor((ms % 60000) / 1000);
    let milesimas = Math.floor((ms % 1000) / 10);

    let minutos_texto = String(minutos).padStart(2, "0");
    let segundos_texto = String(segundos).padStart(2, "0");
    let milesimas_texto = String(milesimas).padStart(2, "0");

    tiempo.textContent = minutos_texto + ":" + segundos_texto + "." + milesimas_texto;
  }

  function generar_superheroes_por_tiempo(transcurrido) {
    while (
      siguiente_superheroe_ms <= limite &&
      transcurrido >= siguiente_superheroe_ms
    ) {
      crear_superheroe();
      siguiente_superheroe_ms += tiempo_entre_superheroes;
    }
  }

  function actualizar_cronometro() {
    let ahora = performance.now();
    let transcurrido = tiempo_acumulado + (ahora - tiempo_inicio);

    if (transcurrido >= limite) {
      transcurrido = limite;

      generar_superheroes_por_tiempo(transcurrido);
      mostrar_tiempo(transcurrido);

      clearInterval(intervalo);
      intervalo = null;
      tiempo_acumulado = limite;

      detener_superheroes();
      return;
    }

    generar_superheroes_por_tiempo(transcurrido);
    mostrar_tiempo(transcurrido);
  }

  function iniciar_cronometro() {
    if (intervalo === null && tiempo_acumulado < limite) {
      tiempo_inicio = performance.now();
      intervalo = setInterval(actualizar_cronometro, 10);
      iniciar_superheroes();
    }
  }

  function detener_cronometro() {
    if (intervalo !== null) {
      tiempo_acumulado += performance.now() - tiempo_inicio;
      clearInterval(intervalo);
      intervalo = null;
      detener_superheroes();
    }
  }

  function reiniciar_cronometro() {
    clearInterval(intervalo);
    intervalo = null;
    tiempo_acumulado = 0;
    tiempo_inicio = null;

    mostrar_tiempo(0);
    reiniciar_superheroes();
  }

  function reproducir_sonido_superheroe() {
    const sonido = sonido_superheroe.cloneNode();
    sonido.volume = sonido_superheroe.volume;
    sonido.play().catch(() => {});
  }

  function crear_superheroe() {
    const superheroe = document.createElement("div");
    superheroe.classList.add("superheroe-suelto");
    superheroe.textContent = "🦸🏼‍♀️";

    zona_superheroes.appendChild(superheroe);
    reproducir_sonido_superheroe();  

    const size = superheroe.offsetWidth || 42;
    const ancho = zona_superheroes.clientWidth;
    const alto = zona_superheroes.clientHeight;

    const x = Math.random() * (ancho - size);
    const y = Math.random() * (alto - size);

    const datos = {
      elemento: superheroe,
      x,
      y,
      dx: (Math.random() - 0.5) * velocidad_superheroe * 2,
      dy: (Math.random() - 0.5) * velocidad_superheroe * 2,
      arrastrando: false
    };

    actualizar_posicion_superheroe(datos);
    activar_arrastre_superheroe(datos);

    superheroes.push(datos);
  }

  function activar_arrastre_superheroe(datos) {
    const superheroe = datos.elemento;
    let offsetX = 0;
    let offsetY = 0;

    superheroe.addEventListener("pointerdown", (e) => {
      datos.arrastrando = true;
      const rect = superheroe.getBoundingClientRect();
      offsetX = e.clientX - rect.left;
      offsetY = e.clientY - rect.top;
      superheroe.setPointerCapture(e.pointerId);
    });

    superheroe.addEventListener("pointermove", (e) => {
      if (!datos.arrastrando) return;

      const rect_zona = zona_superheroes.getBoundingClientRect();
      datos.x = e.clientX - rect_zona.left - offsetX;
      datos.y = e.clientY - rect_zona.top - offsetY;

      limitar_superheroe_a_zona(datos);
      actualizar_posicion_superheroe(datos);
    });

    superheroe.addEventListener("pointerup", () => {
      datos.arrastrando = false;
      datos.dx = (Math.random() - 0.5) * velocidad_superheroe * 2;
      datos.dy = (Math.random() - 0.5) * velocidad_superheroe * 2;
    });

    superheroe.addEventListener("pointercancel", () => {
      datos.arrastrando = false;
    });
  }

  function limitar_superheroe_a_zona(datos) {
    const size = datos.elemento.offsetWidth || 42;
    const ancho = zona_superheroes.clientWidth;
    const alto = zona_superheroes.clientHeight;

    datos.x = Math.max(0, Math.min(ancho - size, datos.x));
    datos.y = Math.max(0, Math.min(alto - size, datos.y));
  }

  function actualizar_posicion_superheroe(datos) {
    datos.elemento.style.left = datos.x + "px";
    datos.elemento.style.top = datos.y + "px";
  }

  function mover_superheroes() {
    if (!superheroes_activos) return;

    superheroes.forEach(datos => {
      if (datos.arrastrando) return;

      datos.x += datos.dx;
      datos.y += datos.dy;

      const size = datos.elemento.offsetWidth || 42;
      const ancho = zona_superheroes.clientWidth;
      const alto = zona_superheroes.clientHeight;

      if (datos.x <= 0 || datos.x >= ancho - size) {
        datos.dx *= -1;
      }

      if (datos.y <= 0 || datos.y >= alto - size) {
        datos.dy *= -1;
      }

      if (Math.random() < 0.02) {
        datos.dx = (Math.random() - 0.5) * velocidad_superheroe * 2;
        datos.dy = (Math.random() - 0.5) * velocidad_superheroe * 2;
      }

      limitar_superheroe_a_zona(datos);
      actualizar_posicion_superheroe(datos);
    });

    animacion_superheroes = requestAnimationFrame(mover_superheroes);
  }

  function iniciar_superheroes() {
    if (superheroes_activos) return;
    superheroes_activos = true;
    mover_superheroes();
  }

  function detener_superheroes() {
    superheroes_activos = false;
    cancelAnimationFrame(animacion_superheroes);
    animacion_superheroes = null;
  }

  function reiniciar_superheroes() {
    detener_superheroes();

    superheroes.forEach(datos => {
      datos.elemento.remove();
    });

    superheroes = [];
    siguiente_superheroe_ms = tiempo_entre_superheroes;
  }

  boton_play.addEventListener("click", iniciar_cronometro);
  boton_detener.addEventListener("click", detener_cronometro);
  boton_reiniciar.addEventListener("click", reiniciar_cronometro);

  mostrar_tiempo(0);
</script>

</body>
</html>
