<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cronómetro Superhéroes</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      
      /* Degradado dinámico continuo: Ciclo épico de Superhéroes */
      background: linear-gradient(135deg, 
        #87CEEB, /* Día: Azul cielo claro */
        #fdbb2d, /* Atardecer brillante: Dorado heroico */
        #d32f2f, /* Crepúsculo: Rojo intenso (estilo cómic) */
        #0b1a30, /* Noche profunda: Azul marino casi negro */
        #1a2a6c, /* Amanecer: Azul oscuro vibrante */
        #87CEEB, /* Regreso al Día para el bucle */
        #fdbb2d  /* Transición suave para reiniciar */
      );
      background-size: 600% 600%;
      animation: degradado-heroico 40s linear infinite;
    }

    @keyframes degradado-heroico {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }
    
    .fondo-ciudad {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 70vh;
      background-image: url("images/ciudad.png");
      background-repeat: no-repeat;
      background-position: bottom center;
      background-size: 100% auto;

      z-index: 0;
      pointer-events: none;
    }

    #zona-superheroes {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 100vh; /* Ocupa toda la pantalla para que puedan rebotar por todos lados */
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }
    
    .superheroe-suelto {
      position: absolute;
      width: 400px; /* Tamaño adaptado para las imágenes PNG */
      height: auto;
      cursor: grab;
      user-select: none;
      touch-action: none;
      pointer-events: auto;
      transition: transform 0.15s;
      filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.3)); 
    }
    
    .superheroe-suelto:active {
      cursor: grabbing;
      transform: scale(1.15);
    }

    .nombre-autor {
      position: absolute;
      top: -28px;
      left: 50%;
      transform: translateX(-50%);

      /* Colores estilo insignia */
      background-color: #FFD700; 
      color: #D32F2F;
      border: 3px solid #D32F2F;
      border-radius: 18px;

      padding: 8px 22px;
      font-size: 17px;
      font-weight: bold;
      letter-spacing: 0.4px;

      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.18);
      white-space: nowrap;
    }

    .contenedor {
      position: relative;
      z-index: 2; /* Por encima de los superhéroes rebotando */
      background-color: rgba(255, 255, 255, 0.95);
      border: 5px solid #1E88E5; /* Borde azul heroico */
      border-radius: 30px;
      padding: 45px 50px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      width: 520px;     
      min-height: 320px; 
      backdrop-filter: blur(2px);
    }

    h1 {
      color: #D32F2F; /* Rojo vibrante */
      margin-bottom: 10px;
      font-size: 50px;
      text-shadow: 3px 3px 0px #FFD700; /* Sombra amarilla estilo cómic */
    }
    
    .superheroe {
      font-size: 100px;
      margin: 10px 0;
      animation: saltito 1s infinite alternate;
    }

    @keyframes saltito {
      from { transform: translateY(0); }
      to { transform: translateY(-10px); }
    }

    #tiempo {
      font-size: 48px;
      font-weight: bold;
      color: #1E88E5; /* Azul vibrante */
      margin: 25px 0;
      background-color: #FFF9C4; /* Fondo amarillo claro */
      padding: 15px;
      border-radius: 20px;
      border: 3px dashed #D32F2F; /* Borde rojo */
    }
    
    .botones button {
      font-size: 18px;
      padding: 12px 18px;
      margin: 8px;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    #play {
      background-color: #1E88E5; /* Azul */
      color: white;
    }

    #detener {
      background-color: #D32F2F; /* Rojo */
      color: white;
    }

    #reiniciar {
      background-color: #FFD700; /* Amarillo/Dorado */
      color: #b71c1c; /* Texto oscuro para contrastar */
    }

    button:hover {
      transform: scale(1.08);
      opacity: 0.9;
    }
  </style>
</head>

<body>
  <div class="fondo-ciudad"></div>

  <div id="zona-superheroes"></div>

  <div class="contenedor">
    <div class="nombre-autor"> 🦸🏼‍♀️ Cesia Josselyn Flores Juárez 🦸🏼‍♀️</div>

    <h1>Cronómetro Superhéroes</h1>

    <div class="superheroe">🦸🏼‍♀️</div>

    <div id="tiempo">00:00.00</div>

    <div class="botones">
      <button id="play">▶️ Play</button>
      <button id="detener">⏸️ Detener</button>
      <button id="reiniciar">🔄 Reiniciar</button>
    </div>
  </div>

<script>
  let tiempo_acumulado = 0;  
  let tiempo_inicio = null;  
  let intervalo = null;

  const limite = 15 * 60 * 1000;

  const tiempo = document.getElementById("tiempo");
  const boton_play = document.getElementById("play");
  const boton_detener = document.getElementById("detener");
  const boton_reiniciar = document.getElementById("reiniciar");

  const zona_superheroes = document.getElementById("zona-superheroes");

  const tiempo_entre_superheroes = 1 * 60 * 1000; // 1 minuto exacto
  const velocidad_superheroe = 1.5;

  let superheroes = [];
  let animacion_superheroes = null;
  let superheroes_activos = false;
  
  // Empezamos en 0 para que el primer superhéroe salga inmediatamente al dar 'Play'
  let siguiente_superheroe_ms = 0; 

  function mostrar_tiempo(ms) {
    let minutos = Math.floor(ms / 60000);
    let segundos = Math.floor((ms % 60000) / 1000);
    let milesimas = Math.floor((ms % 1000) / 10);

    let minutos_texto = String(minutos).padStart(2, "0");
    let segundos_texto = String(segundos).padStart(2, "0");
    let milesimas_texto = String(milesimas).padStart(2, "0");

    tiempo.textContent = minutos_texto + ":" + segundos_texto + "." + milesimas_texto;
  }

  function generar_superheroes_por_tiempo(transcurrido) {
    while (
      siguiente_superheroe_ms <= limite &&
      transcurrido >= siguiente_superheroe_ms
    ) {
      let minuto_actual = Math.floor(siguiente_superheroe_ms / 60000);
      crear_superheroe(minuto_actual);
      siguiente_superheroe_ms += tiempo_entre_superheroes;
    }
  }

  function actualizar_cronometro() {
    let ahora = performance.now();
    let transcurrido = tiempo_acumulado + (ahora - tiempo_inicio);

    if (transcurrido >= limite) {
      transcurrido = limite;

      generar_superheroes_por_tiempo(transcurrido);
      mostrar_tiempo(transcurrido);

      clearInterval(intervalo);
      intervalo = null;
      tiempo_acumulado = limite;

      detener_superheroes();
      return;
    }

    generar_superheroes_por_tiempo(transcurrido);
    mostrar_tiempo(transcurrido);
  }

  function iniciar_cronometro() {
    if (intervalo === null && tiempo_acumulado < limite) {
      tiempo_inicio = performance.now();
      intervalo = setInterval(actualizar_cronometro, 10);
      iniciar_superheroes();
    }
  }

  function detener_cronometro() {
    if (intervalo !== null) {
      tiempo_acumulado += performance.now() - tiempo_inicio;
      clearInterval(intervalo);
      intervalo = null;
      detener_superheroes();
    }
  }

  function reiniciar_cronometro() {
    clearInterval(intervalo);
    intervalo = null;
    tiempo_acumulado = 0;
    tiempo_inicio = null;

    mostrar_tiempo(0);
    reiniciar_superheroes();
  }

  function crear_superheroe(minuto) {
    // 1. ELIMINAR CUALQUIER SUPERHÉROE ANTERIOR PARA QUE NO SE ACUMULEN
    zona_superheroes.innerHTML = "";
    superheroes = [];

    // 2. CREAR EL NUEVO SUPERHÉROE
    const superheroe_elem = document.createElement("img");
    superheroe_elem.classList.add("superheroe-suelto");
    superheroe_elem.draggable = false;

    // Arreglo con tus imágenes
    const imagenes_superheroes = [
      "images/batman.png",
      "images/spiderman.png",
      "images/hulk.png",
      "images/capitan.png",
      "images/superman.png"
    ];

    // Calcula cuál imagen toca dependiendo del minuto actual
    const indice = minuto % imagenes_superheroes.length;
    superheroe_elem.src = imagenes_superheroes[indice];

    zona_superheroes.appendChild(superheroe_elem);

    const size = 150; 
    const ancho = zona_superheroes.clientWidth;
    const alto = zona_superheroes.clientHeight;

    // Aparece en una posición aleatoria
    const x = Math.random() * (ancho - size);
    const y = Math.random() * (alto - size);

    const datos = {
      elemento: superheroe_elem,
      x,
      y,
      dx: (Math.random() - 0.5) * velocidad_superheroe * 2,
      dy: (Math.random() - 0.5) * velocidad_superheroe * 2,
      arrastrando: false
    };

    actualizar_posicion_superheroe(datos);
    activar_arrastre_superheroe(datos);

    superheroes.push(datos);
  }

  function activar_arrastre_superheroe(datos) {
    const superheroe_elem = datos.elemento;
    let offsetX = 0;
    let offsetY = 0;

    superheroe_elem.addEventListener("pointerdown", (e) => {
      datos.arrastrando = true;
      const rect = superheroe_elem.getBoundingClientRect();
      offsetX = e.clientX - rect.left;
      offsetY = e.clientY - rect.top;
      superheroe_elem.setPointerCapture(e.pointerId);
    });

    superheroe_elem.addEventListener("pointermove", (e) => {
      if (!datos.arrastrando) return;

      const rect_zona = zona_superheroes.getBoundingClientRect();
      datos.x = e.clientX - rect_zona.left - offsetX;
      datos.y = e.clientY - rect_zona.top - offsetY;

      limitar_superheroe_a_zona(datos);
      actualizar_posicion_superheroe(datos);
    });

    superheroe_elem.addEventListener("pointerup", () => {
      datos.arrastrando = false;
      datos.dx = (Math.random() - 0.5) * velocidad_superheroe * 2;
      datos.dy = (Math.random() - 0.5) * velocidad_superheroe * 2;
    });

    superheroe_elem.addEventListener("pointercancel", () => {
      datos.arrastrando = false;
    });
  }

  function limitar_superheroe_a_zona(datos) {
    const size = datos.elemento.offsetWidth || 150;
    const ancho = zona_superheroes.clientWidth;
    const alto = zona_superheroes.clientHeight;

    datos.x = Math.max(0, Math.min(ancho - size, datos.x));
    datos.y = Math.max(0, Math.min(alto - size, datos.y));
  }

  function actualizar_posicion_superheroe(datos) {
    datos.elemento.style.left = datos.x + "px";
    datos.elemento.style.top = datos.y + "px";
  }

  function mover_superheroes() {
    if (!superheroes_activos) return;

    superheroes.forEach(datos => {
      if (datos.arrastrando) return;

      datos.x += datos.dx;
      datos.y += datos.dy;

      const size = datos.elemento.offsetWidth || 150;
      const ancho = zona_superheroes.clientWidth;
      const alto = zona_superheroes.clientHeight;

      if (datos.x <= 0 || datos.x >= ancho - size) {
        datos.dx *= -1;
      }

      if (datos.y <= 0 || datos.y >= alto - size) {
        datos.dy *= -1;
      }

      if (Math.random() < 0.02) {
        datos.dx = (Math.random() - 0.5) * velocidad_superheroe * 2;
        datos.dy = (Math.random() - 0.5) * velocidad_superheroe * 2;
      }

      limitar_superheroe_a_zona(datos);
      actualizar_posicion_superheroe(datos);
    });

    animacion_superheroes = requestAnimationFrame(mover_superheroes);
  }

  function iniciar_superheroes() {
    if (superheroes_activos) return;
    superheroes_activos = true;
    mover_superheroes();
  }

  function detener_superheroes() {
    superheroes_activos = false;
    if (animacion_superheroes !== null) {
      cancelAnimationFrame(animacion_superheroes);
      animacion_superheroes = null;
    }
  }

  function reiniciar_superheroes() {
    detener_superheroes();
    zona_superheroes.innerHTML = "";
    superheroes = [];
    siguiente_superheroe_ms = 0; // Se reinicia para que el primero vuelva a salir en el ms 0
  }

  boton_play.addEventListener("click", iniciar_cronometro);
  boton_detener.addEventListener("click", detener_cronometro);
  boton_reiniciar.addEventListener("click", reiniciar_cronometro);

  mostrar_tiempo(0);
</script>

</body>
</html>
