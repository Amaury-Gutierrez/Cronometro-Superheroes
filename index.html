<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Cronómetro Superhéroes</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      
      /* Degradado dinámico continuo: Ciclo épico de Superhéroes */
      background: linear-gradient(135deg, 
        #87CEEB, /* Día: Azul cielo claro */
        #fdbb2d, /* Atardecer brillante: Dorado heroico */
        #d32f2f, /* Crepúsculo: Rojo intenso (estilo cómic) */
        #0b1a30, /* Noche profunda: Azul marino casi negro */
        #1a2a6c, /* Amanecer: Azul oscuro vibrante */
        #87CEEB, /* Regreso al Día para el bucle */
        #fdbb2d  /* Transición suave para reiniciar */
      );
      background-size: 600% 600%;
      animation: degradado-heroico 40s linear infinite;
    }

    @keyframes degradado-heroico {
      0% { background-position: 0% 50%; }
      100% { background-position: 100% 50%; }
    }
    
    .fondo-ciudad {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 150vh;
      background-image: url("images/ciudad.png");
      background-repeat: no-repeat;
      background-position: bottom center;
      background-size: 100% auto;

      z-index: 0;
      pointer-events: none;
    }

    #zona-personajes {
      position: fixed;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 100vh; 
      z-index: 1; 
      overflow: hidden;
      pointer-events: none;
    }
    
    .personaje-suelto {
      position: absolute;
      width: 300px; 
      height: auto;
      cursor: grab;
      user-select: none;
      touch-action: none;
      pointer-events: auto;
      transition: transform 0.15s;
      filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.3)); 
    }
    
    .personaje-suelto:active {
      cursor: grabbing;
      transform: scale(1.15);
    }

    .nombre-autor {
      position: absolute;
      top: -28px;
      left: 50%;
      transform: translateX(-50%);

      background-color: #FFD700; 
      color: #D32F2F;
      border: 3px solid #D32F2F;
      border-radius: 18px;

      padding: 8px 22px;
      font-size: 17px;
      font-weight: bold;
      letter-spacing: 0.4px;

      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.18);
      white-space: nowrap;
    }

    .contenedor {
      position: relative;
      z-index: 2; 
      background-color: rgba(255, 255, 255, 0.95);
      border: 5px solid #1E88E5; 
      border-radius: 30px;
      padding: 45px 50px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      width: 520px;     
      min-height: 320px; 
      backdrop-filter: blur(2px);
    }

    h1 {
      color: #D32F2F; 
      margin-bottom: 10px;
      font-size: 50px;
      text-shadow: 3px 3px 0px #FFD700; 
    }
    
    .icono-principal {
      font-size: 100px;
      margin: 10px 0;
      animation: saltito 1s infinite alternate;
    }

    @keyframes saltito {
      from { transform: translateY(0); }
      to { transform: translateY(-10px); }
    }

    #tiempo {
      font-size: 48px;
      font-weight: bold;
      color: #1E88E5; 
      margin: 25px 0;
      background-color: #FFF9C4; 
      padding: 15px;
      border-radius: 20px;
      border: 3px dashed #D32F2F; 
    }
    
    .botones button {
      font-size: 18px;
      padding: 12px 18px;
      margin: 8px;
      border: none;
      border-radius: 15px;
      cursor: pointer;
      font-weight: bold;
      transition: 0.3s;
    }

    #play {
      background-color: #1E88E5; 
      color: white;
    }

    #detener {
      background-color: #D32F2F; 
      color: white;
    }

    #reiniciar {
      background-color: #FFD700; 
      color: #b71c1c; 
    }

    button:hover {
      transform: scale(1.08);
      opacity: 0.9;
    }
  </style>
</head>

<body>
  <div class="fondo-ciudad"></div>

  <div id="zona-personajes"></div>

  <div class="contenedor">
    <div class="nombre-autor"> 🦸🏼‍♀️ Cesia Josselyn Flores Juárez 🦸🏼‍♀️</div>

    <h1>Cronómetro Superhéroes</h1>

    <div class="icono-principal">⚔️</div>

    <div id="tiempo">00:00.00</div>

    <div class="botones">
      <button id="play">▶️ Play</button>
      <button id="detener">⏸️ Detener</button>
      <button id="reiniciar">🔄 Reiniciar</button>
    </div>
  </div>

<script>
  let tiempo_acumulado = 0;  
  let tiempo_inicio = null;  
  let intervalo = null;

  const limite = 15 * 60 * 1000;

  const tiempo = document.getElementById("tiempo");
  const boton_play = document.getElementById("play");
  const boton_detener = document.getElementById("detener");
  const boton_reiniciar = document.getElementById("reiniciar");

  const zona_personajes = document.getElementById("zona-personajes");

  const tiempo_entre_personajes = 1 * 60 * 1000; // 1 minuto exacto
  const velocidad_personajes = 1.5;

  let personajes_activos = [];
  let animacion_personajes = null;
  let animacion_activa = false;
  
  let siguiente_personaje_ms = 0; 

  // Listas de personajes según la imagen proporcionada
  const lista_heroes = [
    "images/batman.png",
    "images/black_widow.png",
    "images/capitan.png",
    "images/hulk.png",
    "images/ironman.png",
    "images/spiderman.png",
    "images/superman.png",
    "images/thor.png"
  ];

  const lista_villanos = [
    "images/thanos.png",
    "images/duende_verde.png",
    "images/red_skull.png",
    "images/loki.png"
  ];

  function mostrar_tiempo(ms) {
    let minutos = Math.floor(ms / 60000);
    let segundos = Math.floor((ms % 60000) / 1000);
    let milesimas = Math.floor((ms % 1000) / 10);

    let minutos_texto = String(minutos).padStart(2, "0");
    let segundos_texto = String(segundos).padStart(2, "0");
    let milesimas_texto = String(milesimas).padStart(2, "0");

    tiempo.textContent = minutos_texto + ":" + segundos_texto + "." + milesimas_texto;
  }

  function generar_personajes_por_tiempo(transcurrido) {
    while (
      siguiente_personaje_ms <= limite &&
      transcurrido >= siguiente_personaje_ms
    ) {
      crear_enfrentamiento();
      siguiente_personaje_ms += tiempo_entre_personajes;
    }
  }

  function actualizar_cronometro() {
    let ahora = performance.now();
    let transcurrido = tiempo_acumulado + (ahora - tiempo_inicio);

    if (transcurrido >= limite) {
      transcurrido = limite;

      generar_personajes_por_tiempo(transcurrido);
      mostrar_tiempo(transcurrido);

      clearInterval(intervalo);
      intervalo = null;
      tiempo_acumulado = limite;

      detener_animacion();
      return;
    }

    generar_personajes_por_tiempo(transcurrido);
    mostrar_tiempo(transcurrido);
  }

  function iniciar_cronometro() {
    if (intervalo === null && tiempo_acumulado < limite) {
      tiempo_inicio = performance.now();
      intervalo = setInterval(actualizar_cronometro, 10);
      iniciar_animacion();
    }
  }

  function detener_cronometro() {
    if (intervalo !== null) {
      tiempo_acumulado += performance.now() - tiempo_inicio;
      clearInterval(intervalo);
      intervalo = null;
      detener_animacion();
    }
  }

  function reiniciar_cronometro() {
    clearInterval(intervalo);
    intervalo = null;
    tiempo_acumulado = 0;
    tiempo_inicio = null;

    mostrar_tiempo(0);
    reiniciar_animacion();
  }

  function crear_enfrentamiento() {
    // 1. Limpiar la pantalla para que no se acumulen
    zona_personajes.innerHTML = "";
    personajes_activos = [];

    // 2. Seleccionar un héroe y un villano al azar
    const heroe_random = lista_heroes[Math.floor(Math.random() * lista_heroes.length)];
    const villano_random = lista_villanos[Math.floor(Math.random() * lista_villanos.length)];

    // 3. Agregarlos a la pantalla
    agregar_personaje_a_pantalla(heroe_random);
    agregar_personaje_a_pantalla(villano_random);
  }

  function agregar_personaje_a_pantalla(ruta_imagen) {
    const img_elem = document.createElement("img");
    img_elem.classList.add("personaje-suelto");
    img_elem.draggable = false;
    img_elem.src = ruta_imagen;

    zona_personajes.appendChild(img_elem);

    const size = 150; 
    const ancho = zona_personajes.clientWidth;
    const alto = zona_personajes.clientHeight;

    // Posición inicial aleatoria
    const x = Math.random() * (ancho - size);
    const y = Math.random() * (alto - size);

    const datos = {
      elemento: img_elem,
      x,
      y,
      dx: (Math.random() - 0.5) * velocidad_personajes * 2,
      dy: (Math.random() - 0.5) * velocidad_personajes * 2,
      arrastrando: false
    };

    actualizar_posicion_personaje(datos);
    activar_arrastre_personaje(datos);

    personajes_activos.push(datos);
  }

  function activar_arrastre_personaje(datos) {
    const elem = datos.elemento;
    let offsetX = 0;
    let offsetY = 0;

    elem.addEventListener("pointerdown", (e) => {
      datos.arrastrando = true;
      const rect = elem.getBoundingClientRect();
      offsetX = e.clientX - rect.left;
      offsetY = e.clientY - rect.top;
      elem.setPointerCapture(e.pointerId);
    });

    elem.addEventListener("pointermove", (e) => {
      if (!datos.arrastrando) return;

      const rect_zona = zona_personajes.getBoundingClientRect();
      datos.x = e.clientX - rect_zona.left - offsetX;
      datos.y = e.clientY - rect_zona.top - offsetY;

      limitar_personaje_a_zona(datos);
      actualizar_posicion_personaje(datos);
    });

    elem.addEventListener("pointerup", () => {
      datos.arrastrando = false;
      datos.dx = (Math.random() - 0.5) * velocidad_personajes * 2;
      datos.dy = (Math.random() - 0.5) * velocidad_personajes * 2;
    });

    elem.addEventListener("pointercancel", () => {
      datos.arrastrando = false;
    });
  }

  function limitar_personaje_a_zona(datos) {
    const size = datos.elemento.offsetWidth || 150;
    const ancho = zona_personajes.clientWidth;
    const alto = zona_personajes.clientHeight;

    datos.x = Math.max(0, Math.min(ancho - size, datos.x));
    datos.y = Math.max(0, Math.min(alto - size, datos.y));
  }

  function actualizar_posicion_personaje(datos) {
    datos.elemento.style.left = datos.x + "px";
    datos.elemento.style.top = datos.y + "px";
  }

  function mover_personajes() {
    if (!animacion_activa) return;

    personajes_activos.forEach(datos => {
      if (datos.arrastrando) return;

      datos.x += datos.dx;
      datos.y += datos.dy;

      const size = datos.elemento.offsetWidth || 150;
      const ancho = zona_personajes.clientWidth;
      const alto = zona_personajes.clientHeight;

      if (datos.x <= 0 || datos.x >= ancho - size) {
        datos.dx *= -1;
      }

      if (datos.y <= 0 || datos.y >= alto - size) {
        datos.dy *= -1;
      }

      if (Math.random() < 0.02) {
        datos.dx = (Math.random() - 0.5) * velocidad_personajes * 2;
        datos.dy = (Math.random() - 0.5) * velocidad_personajes * 2;
      }

      limitar_personaje_a_zona(datos);
      actualizar_posicion_personaje(datos);
    });

    animacion_personajes = requestAnimationFrame(mover_personajes);
  }

  function iniciar_animacion() {
    if (animacion_activa) return;
    animacion_activa = true;
    mover_personajes();
  }

  function detener_animacion() {
    animacion_activa = false;
    if (animacion_personajes !== null) {
      cancelAnimationFrame(animacion_personajes);
      animacion_personajes = null;
    }
  }

  function reiniciar_animacion() {
    detener_animacion();
    zona_personajes.innerHTML = "";
    personajes_activos = [];
    siguiente_personaje_ms = 0; 
  }

  boton_play.addEventListener("click", iniciar_cronometro);
  boton_detener.addEventListener("click", detener_cronometro);
  boton_reiniciar.addEventListener("click", reiniciar_cronometro);

  mostrar_tiempo(0);
</script>

</body>
</html>
